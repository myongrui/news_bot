    name: arXiv AI and ML
    connector: arxiv
    url: https://export.arxiv.org/api/query
    trust_tier: research
    source_role: deep_analysis
    enabled: true
    topics: [ai, research]
    query: cat:cs.AI OR cat:cs.LG OR cat:cs.CL
    limit: 20
  - id: sec_filings
    name: SEC EDGAR Filings
    connector: sec
    url: https://data.sec.gov
    trust_tier: primary_official
    source_role: primary_truth
    enabled: true
    topics: [markets, filings]
    forms: [8-K, 10-K, 10-Q, S-1]
  - id: sec_press_releases
    name: SEC Press Releases
    connector: rss
    url: https://www.sec.gov/news/pressreleases.rss
    trust_tier: primary_official
    source_role: primary_truth
    enabled: true
    topics: [markets, filings, policy]
    limit: 20
  - id: nist_news
    name: NIST News
    connector: rss
    url: https://www.nist.gov/news-events/news/rss.xml
    trust_tier: primary_official
    source_role: primary_truth
    enabled: true
    topics: [policy, ai, cybersecurity]
    limit: 20
  - id: gdelt_ai_markets
    name: GDELT AI and Markets
    connector: gdelt
    url: https://api.gdeltproject.org/api/v2/doc/doc
    trust_tier: trusted_media
    source_role: context
    enabled: true
    topics: [ai, markets, tech]
    query: '(AI OR "artificial intelligence" OR semiconductor OR Nvidia OR OpenAI) (stock OR market OR earnings OR launch OR regulation)'
    limit: 30
  - id: gdelt_blue_chip_markets
    name: GDELT Blue-Chip Markets
    connector: gdelt
    url: https://api.gdeltproject.org/api/v2/doc/doc
    trust_tier: trusted_media
    source_role: context
    enabled: true
    topics: [markets, blue_chips]
    query: '("Apple" OR Microsoft OR Nvidia OR Amazon OR Alphabet OR Meta OR Tesla OR JPMorgan OR Visa OR Mastercard OR "UnitedHealth" OR "Eli Lilly" OR Berkshire OR Costco OR Walmart) (earnings OR guidance OR revenue OR margin OR buyback OR dividend OR valuation OR "free cash flow")'
    limit: 30
  - id: gdelt_analyst_ratings
    name: GDELT Analyst Ratings and Price Targets
    connector: gdelt
    url: https://api.gdeltproject.org/api/v2/doc/doc
    trust_tier: trusted_media
    source_role: context
    enabled: true
    topics: [markets, blue_chips, analyst_ratings]
    query: '("price target" OR "target price" OR upgrade OR downgrade OR "initiated coverage" OR reiterates OR overweight OR underweight OR outperform OR "market perform") (Nvidia OR Microsoft OR Apple OR Amazon OR Alphabet OR Meta OR Tesla OR JPMorgan OR Visa OR Mastercard OR Costco OR Walmart OR "Eli Lilly" OR Berkshire)'
    limit: 30
  - id: reddit_ai_markets
    name: Reddit AI and Stocks
    connector: reddit
    url: https://oauth.reddit.com
    trust_tier: community_social
    source_role: fast_signal
    enabled: true
    topics: [ai, markets, social]
    subreddits: [MachineLearning, LocalLLaMA, technology, stocks, investing]
    limit: 15
  - id: reddit_blue_chip_discussions
    name: Reddit Blue-Chip Investing Discussions
    connector: reddit
    url: https://oauth.reddit.com
    trust_tier: community_social
    source_role: fast_signal
    enabled: true
    topics: [markets, blue_chips, analyst_ratings, social]
    subreddits: [stocks, investing, StockMarket, SecurityAnalysis, ValueInvesting]
    limit: 15
  - id: x_ai_markets
    name: X AI and Markets
    connector: x
    url: https://api.x.com/2/tweets/search/recent
    trust_tier: community_social
    source_role: fast_signal
    enabled: false
    topics: [ai, markets, social]
    query: '(AI OR OpenAI OR Nvidia OR semiconductor OR earnings) -is:retweet lang:en'
    limit: 25
  - id: uploads
    name: Manual Uploads
    connector: uploads
    url: file://data/uploads
    trust_tier: research
    source_role: deep_analysis
    enabled: true
    topics: [research, markets]
