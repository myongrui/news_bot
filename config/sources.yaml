  - id: gdelt_ai_markets
    name: GDELT AI and Markets
    connector: gdelt
    url: https://api.gdeltproject.org/api/v2/doc/doc
    trust_tier: trusted_media
    source_role: context
    enabled: true
    topics: [ai, markets, tech]
    query: '(AI OR "artificial intelligence" OR semiconductor OR Nvidia OR OpenAI) (stock OR market OR earnings OR launch OR regulation)'
    limit: 30
  - id: gdelt_blue_chip_markets
    name: GDELT Blue-Chip Markets
    connector: gdelt
    url: https://api.gdeltproject.org/api/v2/doc/doc
    trust_tier: trusted_media
    source_role: context
    enabled: true
    topics: [markets, blue_chips]
    query: '("Apple" OR Microsoft OR Nvidia OR Amazon OR Alphabet OR Meta OR Tesla OR JPMorgan OR Visa OR Mastercard OR "UnitedHealth" OR "Eli Lilly" OR Berkshire OR Costco OR Walmart) (earnings OR guidance OR revenue OR margin OR buyback OR dividend OR valuation OR "free cash flow")'
    limit: 30
  - id: gdelt_analyst_ratings
    name: GDELT Analyst Ratings and Price Targets
    connector: gdelt
    url: https://api.gdeltproject.org/api/v2/doc/doc
    trust_tier: trusted_media
    source_role: context
    enabled: true
    topics: [markets, blue_chips, analyst_ratings]
    query: '("price target" OR "target price" OR upgrade OR downgrade OR "initiated coverage" OR reiterates OR overweight OR underweight OR outperform OR "market perform") (Nvidia OR Microsoft OR Apple OR Amazon OR Alphabet OR Meta OR Tesla OR JPMorgan OR Visa OR Mastercard OR Costco OR Walmart OR "Eli Lilly" OR Berkshire)'
    limit: 30
  - id: reddit_ai_markets
    name: Reddit AI and Stocks
    connector: reddit
    url: https://oauth.reddit.com
    trust_tier: community_social
    source_role: fast_signal
    enabled: true
    topics: [ai, markets, social]
    subreddits: [MachineLearning, LocalLLaMA, technology, stocks, investing, singularity, OpenAI]
    limit: 15
  - id: reddit_blue_chip_discussions
    name: Reddit Blue-Chip Investing Discussions
    connector: reddit
    url: https://oauth.reddit.com
    trust_tier: community_social
    source_role: fast_signal
    enabled: true
    topics: [markets, blue_chips, analyst_ratings, social]
    subreddits: [stocks, investing, StockMarket, SecurityAnalysis, ValueInvesting, wallstreetbets]
    limit: 15
  # No-API X: unauthenticated syndication timelines for a curated handle list (best-effort).
  # DISABLED by default: X hard-throttles (HTTP 429) the syndication endpoint from datacenter
  # IPs. To enable, set enabled: true AND point `url` at a residential egress / proxy / mirror
  # of https://syndication.twitter.com. From a residential IP the default host works as-is.
  - id: x_ai
    name: X AI Voices
    connector: x
    url: https://syndication.twitter.com
    trust_tier: community_social
    source_role: fast_signal
    enabled: false
    topics: [ai, research, social]
    accounts:
      - sama
      - gdb
      - karpathy
      - OpenAI
      - AnthropicAI
      - GoogleDeepMind
      - demishassabis
      - ylecun
      - JeffDean
      - _akhaliq
      - arankomatsuzaki
      - swyx
      - simonw
      - emollick
      - rowancheung
      - drjimfan
      - alexandr_wang
    limit: 12
  # Disabled by default — see the note on x_ai above (enable + set a working egress in `url`).
  - id: x_markets
    name: X FinTwit
    connector: x
    url: https://syndication.twitter.com
    trust_tier: community_social
    source_role: fast_signal
    enabled: false
    topics: [markets, blue_chips, social]
    accounts:
      - DeItaone
      - unusual_whales
      - StockMKTNewz
      - KobeissiLetter
      - charliebilello
    limit: 12
