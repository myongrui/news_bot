  - id: github_trending_ai
    name: GitHub Trending AI
    connector: github_trending
    url: https://api.github.com
    trust_tier: community_social
    source_role: fast_signal
    enabled: true
    topics: [developer_tools, ai, research]
    # NOTE: GitHub search 422s if multiple OR'd topic qualifiers are combined with a
    # pushed:/created: range. Keep a single topic qualifier here.
    query: topic:llm
    window_days: 30
    limit: 25
