{% extends "base.html" %}
{% block content %}
<section class="page-head">
  <div>
    <h1>Uploads</h1>
  </div>
</section>
<section class="band">
  <form class="upload-form" action="/upload" method="post" enctype="multipart/form-data">
    <input type="file" name="file" accept=".pdf,.txt,.md,.html,.htm" required>
    <button type="submit">Upload</button>
  </form>
</section>
<section class="band">
  <h2>Files</h2>
  <ul class="tight-list">
    {% for path in uploads %}
    <li>{{ path.name }}</li>
    {% else %}
    <li>No uploaded files.</li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
